<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#080E1A"/>
<meta name="robots" content="{{ meta_robots | default('index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1') }}"/>

<title>{{ page_title }}</title>
<meta name="description" content="{{ meta_description }}"/>
<link rel="canonical" href="{{ canonical_url }}"/>

<meta property="og:locale" content="en_IN"/>
<meta property="og:type" content="{{ og_type | default('website') }}"/>
<meta property="og:title" content="{{ page_title }}"/>
<meta property="og:description" content="{{ meta_description }}"/>
<meta property="og:url" content="{{ canonical_url }}"/>
<meta property="og:site_name" content="Auromaa Associates"/>
<meta property="og:image" content="{{ og_image | default('https://www.auromaaassociates.com/static/images/logo.png') }}"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="Auromaa Associates Intellectual Property Law Firm"/>

<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ page_title }}"/>
<meta name="twitter:description" content="{{ meta_description }}"/>
<meta name="twitter:image" content="{{ og_image | default('https://www.auromaaassociates.com/static/images/logo.png') }}"/>
<meta name="twitter:image:alt" content="Auromaa Associates Intellectual Property Law Firm"/>

{% include "partials/schema.html" %}

<link rel="stylesheet" href="/static/css/styles.css"/>
<script>
(function() {
  var match = document.cookie.match(/(^| )auromaa_disclaimer_agreed=([^;]+)/);
  var isAgreed = (match && match[2] === "true") || (localStorage.getItem("auromaa_disclaimer_agreed") === "true");
  if (isAgreed) {
    document.documentElement.classList.add("disclaimer-agreed");
  }
})();
</script>
